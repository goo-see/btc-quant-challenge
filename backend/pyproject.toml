[project]
name = "quant-trader"
version = "0.1.0"
description = "₩100K → ₩1M Bitcoin Quant Challenge — Upbit KRW-BTC automated trading system"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "numpy>=2.0",
    "pandas>=2.2,<3",
    "pyarrow>=17",
    "structlog>=24",
    "pyjwt>=2.9",
    "pyyaml>=6",
    "alembic>=1.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",
    "types-pyyaml",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101", "RUF012", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ASYNC", "E501"]
"../scripts/**" = ["E501", "ASYNC240", "T201"]
"app/backtest/report.py" = ["E501"]
"app/backtest/research.py" = ["E501"]
"app/backtest/research2.py" = ["E501"]
"app/monitoring/readiness.py" = ["E501"]
"app/validation/**" = ["E501"]
"app/research/**" = ["E501"]
"tests/unit/test_exit_round.py" = ["E501"]
"tests/unit/test_e1_forward.py" = ["E501"]
"tests/unit/test_sleeves.py" = ["E501"]
"tests/unit/test_eth_grid.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["network: tests that hit the real Upbit public API (deselect with -m 'not network')"]
